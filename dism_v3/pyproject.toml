[build-system]
requires = ["setuptools>=64", "wheel", "torch>=2.9"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-dism"
version = "0.1.0"
description = "DISM v3 CUDA operators and PyTorch attention modules"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch>=2.9",
    "triton>=3.5",
    "transformers>=4.51",
    "flash-linear-attention>=0.4.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
swa = ["flash-attn>=2.8"]
test = ["pytest>=8", "numpy"]

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["python"]
include = ["flash_dism", "flash_dism.*"]
namespaces = true

[tool.setuptools.package-data]
"flash_dism.inference" = ["csrc/*.cpp", "csrc/*.cu", "csrc/*.h", "csrc/*.hpp", "csrc/*.cuh"]
